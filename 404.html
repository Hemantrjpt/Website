<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — File Not Found | TITANIC HUB</title>
<meta name="description" content="This page doesn't exist in the archive.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0c0b09;
    --bg-panel:#17140f;
    --bg-panel-raised:#1f1a13;
    --ink:#e9e2d1;
    --ink-dim:#a89e8c;
    --ink-faint:#6b6455;
    --brass:#c8973f;
    --brass-bright:#e0b563;
    --steel:#5b7c8d;
    --rust:#9c4230;
    --border:rgba(233,226,209,0.12);
    --font-display:'Staatliches', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-void);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(ellipse at 20% -10%, rgba(200,151,63,0.05), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(91,124,141,0.06), transparent 55%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/></svg>");
  }
  a{color:inherit;}
  ::selection{background:var(--brass);color:#0c0b09;}
  :focus-visible{outline:2px solid var(--brass-bright);outline-offset:3px;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 28px;position:relative;z-index:1;}

  header{
    position:sticky;top:0;z-index:20;
    background:rgba(12,11,9,0.86);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1100px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand-mark-img{width:36px;height:36px;flex:none;border-radius:8px;object-fit:cover;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 20px;
    background:var(--brass);
    color:#191305;
    font-weight:600;
    font-size:0.92rem;
    text-decoration:none;
    border:none;
    cursor:pointer;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    transition:background 0.2s ease, transform 0.15s ease;
  }
  .btn:hover{background:var(--brass-bright);transform:translateY(-1px);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--border);clip-path:none;}
  .btn-ghost:hover{border-color:var(--brass);color:var(--brass-bright);background:transparent;}

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 0;
    position:relative;
    z-index:1;
  }
  .error-block{max-width:640px;text-align:center;padding:0 28px;}
  .error-stamp{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:0.8rem;
    letter-spacing:0.14em;
    padding:4px 12px;
    border:1.5px solid var(--rust);
    color:#e08a72;
    transform:rotate(-3deg);
    margin-bottom:24px;
  }
  .error-code{
    font-family:var(--font-display);
    font-size:clamp(5rem, 16vw, 9rem);
    line-height:0.9;
    letter-spacing:0.02em;
    color:var(--ink);
    margin:0 0 12px;
  }
  .error-title{
    font-family:var(--font-display);
    font-size:1.6rem;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0 0 16px;
  }
  .error-body{color:var(--ink-dim);margin:0 0 32px;font-size:1.02rem;}
  .error-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}

  footer{padding:32px 0;border-top:1px solid var(--border);position:relative;z-index:1;}
  .foot-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;max-width:1100px;margin:0 auto;padding:0 28px;}
  .foot-row p{margin:0;color:var(--ink-faint);font-size:0.85rem;}
  .foot-row a{color:var(--ink-faint);text-decoration:none;}
  .foot-row a:hover{color:var(--brass-bright);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="TITANIC HUB" class="brand-mark-img">
    </a>
  </nav>
</header>

<main>
  <div class="error-block">
    <span class="error-stamp">NO RECORD FOUND</span>
    <p class="error-code">404</p>
    <h1 class="error-title">This file isn't in the archive</h1>
    <p class="error-body">The page you're looking for doesn't exist, got moved, or never made it out of testing. Command wasn't able to locate it.</p>
    <div class="error-actions">
      <a href="index.html" class="btn">Back to home</a>
      <a href="index.html#archive" class="btn btn-ghost">Browse the archive</a>
    </div>
  </div>
</main>

<footer>
  <div class="foot-row">
    <p>© <span id="year"></span> TITANIC HUB</p>
    <p><a href="disclaimer.html">Disclaimer</a></p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>

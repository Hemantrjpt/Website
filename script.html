<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),root=$('content'),toast=$('toast');
$('year').textContent=new Date().getFullYear();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2300)}
async function copyText(value){try{await navigator.clipboard.writeText(value);return true}catch{const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}}
$('share-btn').addEventListener('click',async()=>notify(await copyText(location.href)?'Page link copied':'Copy the page URL from your browser'));
const toggle=$('menu-toggle'),mobile=$('mobile-links');
toggle.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close navigation':'Open navigation');toggle.textContent=open?'×':'☰';mobile.classList.toggle('open',open)});
mobile.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{mobile.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation');toggle.textContent='☰'}));
const back=$('back-top'),progress=$('progress');function scrollUI(){const max=document.documentElement.scrollHeight-innerHeight;progress.style.transform='scaleX('+(max>0?scrollY/max:0)+')';back.classList.toggle('show',scrollY>450)}addEventListener('scroll',scrollUI,{passive:true});scrollUI();back.addEventListener('click',()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
function renderError(message){root.innerHTML='<section class="hero error-state"><div class="eyebrow">Archive record unavailable</div><h1>Entry not found</h1><p>'+esc(message)+'</p><a class="btn primary" href="index.html#archive">Return to archive</a></section>'}
(async()=>{try{
const slug=new URLSearchParams(location.search).get('slug');if(!slug||!/^[a-z0-9-]+$/.test(slug))throw new Error('This link is missing a valid script slug.');
const db=window.supabase.createClient('https://rtupkcgzidtyhwtnwosh.supabase.co','sb_publishable_kMNqE9uKrKo9pMjMo19Rhg_DBP5xYF1',{auth:{persistSession:false,autoRefreshToken:false}});
const {data,error}=await db.from('scripts').select('id,title,slug,game_name,description,script_body,download_url,thumbnail_url,tags,created_at,updated_at,published_at,featured,status').eq('slug',slug).eq('status','published').maybeSingle();
if(error)throw new Error('The published script library could not be reached. Please try again later.');
if(!data)throw new Error('This script is not published or may have been removed.');
const title=String(data.title||'Untitled script'),game=String(data.game_name||'Script archive'),desc=String(data.description||'No description has been provided by the publisher.'),tags=Array.isArray(data.tags)?data.tags.filter(t=>typeof t==='string'&&t.trim()):[],download=safeUrl(data.download_url),body=typeof data.script_body==='string'?data.script_body:'',thumb=safeUrl(data.thumbnail_url),updated=data.updated_at||data.published_at||data.created_at;
const date=updated?new Date(updated):null,updatedText=date&&!Number.isNaN(date.getTime())?date.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Not provided';
document.title=title+' — TITANIC HUB';const meta=document.querySelector('meta[name="description"]');if(meta)meta.content=desc.slice(0,155);const ogTitle=document.querySelector('meta[property="og:title"]');if(ogTitle)ogTitle.content=title+' — TITANIC HUB';const ogDesc=document.querySelector('meta[property="og:description"]');if(ogDesc)ogDesc.content=desc.slice(0,200);if(thumb){const ogImage=document.querySelector('meta[property="og:image"]');if(ogImage)ogImage.content=thumb}
root.innerHTML='<section class="hero"><span class="stamp">'+(data.featured?'Featured publication':'Published entry')+'</span><h1>'+esc(title)+'</h1><p class="hero-description">'+esc(desc)+'</p><div class="tags"><span class="tag">'+esc(game)+'</span>'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><div class="stats"><div class="stat"><span class="stat-label">Publication status</span><span class="stat-value live">Published</span></div><div class="stat"><span class="stat-label">Category</span><span class="stat-value">'+esc(game)+'</span></div><div class="stat"><span class="stat-label">Last updated</span><span class="stat-value">'+esc(updatedText)+'</span></div><div class="stat"><span class="stat-label">Publisher</span><span class="stat-value">TITANIC HUB archive</span></div></div></section><section class="layout"><div><h2 class="section-title">Overview</h2><p class="copy">'+esc(desc)+'</p><h2 class="section-title">Entry details</h2><div class="detail-card"><h2>Published information</h2><p>Game or category: '+esc(game)+'<br>Publication status: Published<br>Last updated: '+esc(updatedText)+'</p></div>'+(tags.length?'<div class="detail-card"><h2>Topics & tags</h2><div class="tags">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div>':'')+'<div class="publisher-note"><div class="seal">TH</div><div><h3>Archive record</h3><p>This page is generated from the published TITANIC HUB CMS entry. Updates to the published record appear here without creating another HTML page.</p></div></div></div><aside class="deploy"><span class="eyebrow">Published resource</span><h2>Script access</h2><p class="deploy-intro">Use the publisher-provided resource below, if available.</p>'+(body?'<pre class="code-box" id="script-code"></pre><button class="btn primary" id="copy-script" type="button">Copy script content</button>': '<div class="code-box empty">'+(download?'Inline content is not provided. Use the external resource below.':'No script content or download link has been provided for this entry.')+'</div>')+(download?'<a class="btn '+(body?'':'primary')+'" href="'+esc(download)+'" target="_blank" rel="noopener noreferrer">Open published resource ↗</a>':'')+'<button class="btn" id="copy-url" type="button">Copy page link</button><div class="mini-meta"><span>Record slug</span><span>'+esc(data.slug)+'</span></div></aside></section><section class="page-section"><h2 class="section-title">About this entry</h2><p class="section-intro">The details shown on this page come from the archive record. Unavailable metadata is intentionally left out rather than filled with invented version numbers, activity claims, or update notes.</p></section>';
if(body){$('script-code').textContent=body;$('copy-script').addEventListener('click',async()=>{const ok=await copyText(body);notify(ok?'Script content copied':'Copy failed; select the content and copy manually')})}
$('copy-url').addEventListener('click',async()=>notify(await copyText(location.href)?'Page link copied':'Copy the page URL from your browser'));
}catch(e){renderError(e.message||'Could not load this archive entry.')}})();
})();
</script>

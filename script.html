<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),root=$('content'),toast=$('toast');
$('year').textContent=new Date().getFullYear();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v,location.href);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const textList=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim()):[];
function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2600)}
async function copyText(value){try{await navigator.clipboard.writeText(value);return true}catch{const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}}
$('share-btn').addEventListener('click',async()=>notify(await copyText(location.href)?'Page link copied':'Copy the page URL from your browser'));
const toggle=$('menu-toggle'),menuPanel=$('menu-panel'),menuBackdrop=$('menu-backdrop');
function closeMenu(){menuPanel.classList.remove('is-open');menuBackdrop.classList.remove('is-open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open menu')}
toggle.addEventListener('click',()=>{if(menuPanel.classList.contains('is-open'))closeMenu();else{menuPanel.classList.add('is-open');menuBackdrop.classList.add('is-open');toggle.setAttribute('aria-expanded','true');toggle.setAttribute('aria-label','Close menu')}});
menuBackdrop.addEventListener('click',closeMenu);menuPanel.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeMenu));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
const back=$('back-top'),progress=$('progress');function scrollUI(){const max=document.documentElement.scrollHeight-innerHeight;progress.style.transform='scaleX('+(max>0?scrollY/max:0)+')';back.classList.toggle('is-visible',scrollY>450)}addEventListener('scroll',scrollUI,{passive:true});scrollUI();back.addEventListener('click',()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
function renderError(message){root.innerHTML='<section class="hero error-state"><div class="eyebrow">Archive record unavailable</div><h1>Entry not found</h1><p>'+esc(message)+'</p><a class="btn primary" href="index.html#archive">Return to the archive</a></section>'}
function renderDossier(data){
const title=String(data.title||'Untitled script'),game=String(data.game_name||'Script archive'),desc=String(data.description||'No description has been provided by the publisher.'),tags=textList(data.tags),features=textList(data.features),download=safeUrl(data.download_url),body=typeof data.script_body==='string'?data.script_body:'',thumb=safeUrl(data.thumbnail_url),banner=safeUrl(data.banner_url),video=safeUrl(data.video_url),requirements=String(data.requirements||''),executor=String(data.executor||''),instructions=String(data.instructions||''),changelog=String(data.changelog||''),version=String(data.version||'Not specified'),status=String(data.status||'Published'),updated=data.updated_at||data.published_at||data.created_at;
const date=updated?new Date(updated):null,updatedText=date&&!Number.isNaN(date.getTime())?date.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Not provided';
document.title=title+' — TITANIC HUB';
const meta=document.querySelector('meta[name="description"]');if(meta)meta.content=desc.slice(0,155);
const ogTitle=document.querySelector('meta[property="og:title"]');if(ogTitle)ogTitle.content=title+' — TITANIC HUB';
const ogDesc=document.querySelector('meta[property="og:description"]');if(ogDesc)ogDesc.content=desc.slice(0,200);
if(banner||thumb){const ogImage=document.querySelector('meta[property="og:image"]');if(ogImage)ogImage.content=banner||thumb}
const stats='<div class="stats-box"><div class="stat-item"><span class="stat-label">Status</span><span class="stat-value is-live">'+esc(status)+'</span></div><div class="stat-item"><span class="stat-label">Latest version</span><span class="stat-value">'+esc(version)+'</span></div><div class="stat-item"><span class="stat-label">Last updated</span><span class="stat-value">'+esc(updatedText)+'</span></div><div class="stat-item"><span class="stat-label">Views</span><span class="stat-value">'+esc(Number(data.views||0).toLocaleString())+'</span></div></div>';
root.innerHTML='<section class="dossier-head" data-reveal-text><span class="stamp">'+(data.featured?'Featured publication':'Published entry')+'</span><h1>'+esc(title)+'</h1><p class="game-tag">'+esc(game)+'</p><p class="hero-description">'+esc(desc)+'</p><div class="tag-row">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>'+stats+(banner?'<div class="dossier-banner"><img src="'+esc(banner)+'" alt="'+esc(title)+' cover image" loading="eager"></div>':'')+'</section><div class="main-grid"><div class="col"><h2>Overview</h2><p>'+esc(desc)+'</p>'+(features.length?'<h2>What it does</h2><ul class="feature-list" data-reveal-text>'+features.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+(requirements?'<div class="req-box"><strong>Requirements:</strong> '+esc(requirements)+'</div>':'')+(executor?'<div class="req-box"><strong>Compatible executor:</strong> '+esc(executor)+' <a href="executors.html" class="view-log-link">See supported executors</a></div>':'')+(thumb?'<div class="arch-card"><img src="'+esc(thumb)+'" alt="'+esc(title)+' thumbnail" style="display:block;width:100%;max-height:280px;object-fit:cover"></div>':'')+(instructions?'<h2>Installation &amp; usage</h2><ol class="steps">'+instructions.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'')+'</div><div class="col"><div class="deploy-panel" data-reveal-text><h2>Loadstring</h2><p class="deploy-intro">Copy the publisher-provided script content below.</p>'+(body?'<div class="code-box"><code id="script-code"></code></div>':'<div class="code-box"><code>'+(download?'Inline script content is not provided. Use the published resource below.':'No script content or download link has been provided.')+'</code></div>')+'<button class="btn primary" style="display:flex" id="copy-script" type="button">Copy</button>'+'<button class="btn" id="copy-url" type="button">Copy page link</button>'+(instructions?'<h2 style="margin-top:24px">How to use</h2><ol class="steps">'+instructions.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'')+'<div class="mini-meta"><span>Record slug</span><span>'+esc(data.slug)+'</span></div></div></div></div>'+(video?'<section class="page-section"><h2>Live feed</h2><p class="lede-sm">A tutorial provided by the publisher.</p><div class="live-feed" id="live-feed" data-video="'+esc(video)+'"><span class="live-tag">REC</span><button class="play-btn" type="button" id="play-video-btn" aria-label="Play tutorial"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button></div><p class="live-feed-caption">Open the video guide for this script.</p></section>':'')+(features.length?'<section class="page-section"><h2>Core architecture</h2><p class="lede-sm">Published feature modules for this entry.</p>'+features.slice(0,4).map((x,i)=>'<div class="arch-card"><h3>'+esc(x)+'</h3><p>Part of the published feature set for '+esc(title)+'.</p></div>').join('')+'</section>':'')+(changelog.trim()?'<section class="page-section" id="update-log"><h2>Update log</h2><div class="timeline">'+changelog.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map((x,i)=>'<div class="timeline-item '+(i===0?'is-latest':'')+'"><div class="v-num">'+(i===0?esc(version):'Update '+(i+1))+'</div><div class="v-time">'+(i===0?esc(updatedText):'Earlier update')+'</div><p>'+esc(x)+'</p></div>').join('')+'</div></section>':'');
if(body){$('script-code').textContent=body}
$('copy-script').addEventListener('click',async()=>{const value=body||download;if(!value){notify('No script content or resource URL is available');return}const ok=await copyText(value);notify(ok?(body?'Loadstring copied to clipboard':'Resource URL copied to clipboard'):'Copy failed — copy manually')});
$('copy-url').addEventListener('click',async()=>notify(await copyText(location.href)?'Link copied to clipboard':'Copy the URL from your address bar'));
if(video){const feed=$('live-feed'),play=$('play-video-btn'),match=video.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);if(match){const img=document.createElement('img');img.className='live-feed-thumb';img.alt='Video thumbnail';img.src='https://img.youtube.com/vi/'+match[1]+'/hqdefault.jpg';img.onload=()=>img.classList.add('is-loaded');feed.prepend(img);play.addEventListener('click',()=>{const iframe=document.createElement('iframe');iframe.src='https://www.youtube.com/embed/'+match[1]+'?autoplay=1';iframe.title='Script tutorial';iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';iframe.allowFullscreen=true;feed.replaceChildren(iframe)})}else play.addEventListener('click',()=>window.open(video,'_blank','noopener,noreferrer'))}
}
(async()=>{try{
const slug=new URLSearchParams(location.search).get('slug');if(!slug||!/^[a-z0-9-]+$/i.test(slug))throw new Error('This link is missing a valid script slug.');
if(!window.supabase?.createClient)throw new Error('The archive service did not load. Refresh the page and try again.');
const db=window.supabase.createClient('https://rtupkcgzidtyhwtnwosh.supabase.co','sb_publishable_kMNqE9uKrKo9pMjMo19Rhg_DBP5xYF1',{auth:{persistSession:false,autoRefreshToken:false}});
const query=db.from('scripts').select('id,title,slug,game_name,description,script_body,download_url,thumbnail_url,banner_url,tags,status,featured,views,created_at,updated_at,published_at,version,executor,requirements,features,instructions,changelog,video_url').eq('slug',slug).eq('status','published').maybeSingle();
const result=await Promise.race([query,new Promise((_,reject)=>setTimeout(()=>reject(new Error('The archive request timed out. Please refresh and try again.')),12000))]);
if(result.error)throw new Error('The published script library could not be reached. Please try again later.');
if(!result.data)throw new Error('This script is not published or may have been removed.');
renderDossier(result.data);
}catch(e){renderError(e?.message||'Could not load this archive entry.')}
})();
})();
</script>
